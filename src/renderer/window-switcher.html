<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Window Switcher</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: no-drag;
    }

    .switcher-container {
      background: rgba(30, 30, 30, 0.95);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      max-width: 90vw;
      max-height: 80vh;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .windows-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      max-width: 800px;
    }

    .window-card {
      background: rgba(50, 50, 50, 0.8);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 140px;
      position: relative;
    }

    .window-card:hover {
      background: rgba(70, 70, 70, 0.9);
      border-color: rgba(100, 149, 237, 0.5);
      transform: translateY(-2px);
    }

    .window-card.selected {
      background: rgba(80, 80, 80, 0.95);
      border-color: rgba(100, 149, 237, 1);
      box-shadow: 0 0 20px rgba(100, 149, 237, 0.3);
    }

    .window-preview {
      width: 100%;
      height: 80px;
      background: rgba(40, 40, 40, 0.8);
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .window-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .window-icon {
      width: 32px;
      height: 32px;
      color: rgba(255, 255, 255, 0.6);
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .window-title {
      color: rgba(255, 255, 255, 0.95);
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
      padding: 0 8px;
    }

    .window-index {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(100, 149, 237, 0.9);
      color: white;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .hint {
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      text-align: center;
      margin-top: 16px;
    }

    /* Empty state */
    .empty-state {
      padding: 40px;
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="switcher-container">
    <div class="windows-grid" id="windowsGrid">
      <!-- Windows will be inserted here dynamically -->
    </div>
    <div class="hint" id="hint">
      Press <strong>;</strong> again to cycle or release <strong>⌘</strong> to switch
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    // Receive windows data from main process
    let windows = [];
    let selectedIndex = 0;

    // Listen for window list updates
    ipcRenderer.on('window-switcher:update-list', (event, data) => {
      console.log('Received window list:', data);
      windows = data.windows || [];
      selectedIndex = data.selectedIndex || 0;
      renderWindows();
    });

    ipcRenderer.on('window-switcher:select-next', () => {
      if (windows.length > 0) {
        selectedIndex = (selectedIndex + 1) % windows.length;
        renderWindows();
      }
    });

    ipcRenderer.on('window-switcher:select-previous', () => {
      if (windows.length > 0) {
        selectedIndex = (selectedIndex - 1 + windows.length) % windows.length;
        renderWindows();
      }
    });

    function renderWindows() {
      const grid = document.getElementById('windowsGrid');
      if (!grid) return;

      if (windows.length === 0) {
        grid.innerHTML = '<div class="empty-state">No windows available</div>';
        return;
      }

      grid.innerHTML = windows.map((win, index) => `
        <div class="window-card ${index === selectedIndex ? 'selected' : ''}"
             data-index="${index}"
             onclick="selectWindow(${index})">
          <div class="window-index">${index + 1}</div>
          <div class="window-preview">
            ${win.thumbnail
              ? `<img src="${win.thumbnail}" alt="${win.title}">`
              : `<svg class="window-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                   <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                   <line x1="9" y1="3" x2="9" y2="21"></line>
                 </svg>`
            }
          </div>
          <div class="window-title" title="${escapeHtml(win.title)}">
            ${escapeHtml(win.title) || 'Untitled Window'}
          </div>
        </div>
      `).join('');
    }

    function selectWindow(index) {
      selectedIndex = index;
      renderWindows();
      ipcRenderer.send('window-switcher:select', windows[index].id);
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Handle keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === ';' || e.key === ':') {
        e.preventDefault();
        if (e.shiftKey) {
          // Shift+; goes backwards
          if (windows.length > 0) {
            selectedIndex = (selectedIndex - 1 + windows.length) % windows.length;
            renderWindows();
          }
        } else {
          // ; goes forward
          if (windows.length > 0) {
            selectedIndex = (selectedIndex + 1) % windows.length;
            renderWindows();
          }
        }
      }
    });
  </script>
</body>
</html>
