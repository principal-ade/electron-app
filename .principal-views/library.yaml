version: "1.0.0"
name: "principal-ade"
description: "Principal ADE - The future of Agentic Development Environment"

# Service resource registry
# Define all services in this repository with their OTEL resource attributes
resources:
  # ============================================
  # PRODUCTION SCOPES (Process Boundaries)
  # ============================================
  principal-ade:
    service.name: "principal-ade"
    service.version: "0.0.410"
    deployment.environment: "development"
    project: "principal-ade"
    description: "Electron main process - Node.js runtime"
    owned-scopes:
      - "principal-ade"

  principal-ade-renderer:
    service.name: "principal-ade"
    service.version: "0.0.410"
    deployment.environment: "development"
    project: "principal-ade"
    description: "Electron renderer process - Chromium/React UI"
    owned-scopes:
      - "principal-ade-renderer"

  principal-ade-daemon:
    service.name: "principal-ade-daemon"
    service.version: "0.0.410"
    deployment.environment: "development"
    process.type: "pty-daemon"
    project: "principal-ade"
    description: "Standalone PTY daemon process"
    owned-scopes:
      - "principal-ade-daemon"

  # ============================================
  # DEVELOPMENT SCOPES
  # ============================================
  principal-ade-storybook:
    service.name: "principal-ade-storybook"
    service.version: "0.0.410"
    deployment.environment: "development"
    project: "principal-ade"

  principal-ade-tests:
    service.name: "principal-ade-tests"
    service.version: "0.0.410"
    deployment.environment: "test"
    test.suite: "integration"
    project: "principal-ade"

nodeComponents:
  # ============================================
  # SPAN CONVENTIONS
  # ============================================
  span-convention:
    defaultLabel: "Span Convention"
    description: "OpenTelemetry span naming convention definition"
    tags: ["otel", "span"]
    color: "#22C55E"

  # ============================================
  # PROCESSES
  # ============================================
  main-process:
    defaultLabel: "Main Process"
    description: "Electron main process - Node.js backend handling IPC, services, and system operations"
    tags: ["process"]
    color: "#4F46E5"

  pty-daemon:
    defaultLabel: "PTY Daemon"
    description: "Standalone Node.js process managing persistent PTY sessions via Unix socket"
    tags: ["process"]
    color: "#0D9488"

  renderer-process:
    defaultLabel: "Renderer Process"
    description: "React/TypeScript UI process running in Chromium"
    tags: ["process"]
    color: "#7C3AED"

  preload:
    defaultLabel: "Preload Script"
    description: "Bridge script exposing safe APIs to renderer"
    tags: ["process"]
    color: "#8B5CF6"

  # ============================================
  # WINDOWS
  # ============================================
  principal-window:
    defaultLabel: "Principal Window"
    description: "Main app shell - authentication, workspaces, settings, feed"
    tags: ["window"]
    color: "#2563EB"

  repo-manager:
    defaultLabel: "Repo Manager"
    description: "Repository exploration workspace with multi-pane layout"
    tags: ["window"]
    color: "#3B82F6"

  alexandria-workspace:
    defaultLabel: "Alexandria Workspace"
    description: "Knowledge base workspace for code exploration"
    tags: ["window"]
    color: "#60A5FA"

  dev-workspace:
    defaultLabel: "Dev Workspace"
    description: "Development environment window"
    tags: ["window"]
    color: "#93C5FD"

  extension-window:
    defaultLabel: "Extension Window"
    description: "Browser window for extensions"
    tags: ["window"]
    color: "#BFDBFE"

  # ============================================
  # MAIN PROCESS SERVICES
  # ============================================
  auth-service:
    defaultLabel: "Auth Service"
    description: "Authentication, JWT handling, and secure token IPC"
    tags: ["service"]
    color: "#DC2626"

  git-service:
    defaultLabel: "Git Service"
    description: "Core git operations (status, commit, branch, etc.)"
    tags: ["service"]
    color: "#F97316"

  git-sync-service:
    defaultLabel: "Git Sync Service"
    description: "WebSocket-based git synchronization manager"
    tags: ["service"]
    color: "#FB923C"

  git-status-service:
    defaultLabel: "Git Status Service"
    description: "Repository git status tracking and file change detection"
    tags: ["service"]
    color: "#FDBA74"

  repository-service:
    defaultLabel: "Repository Service"
    description: "Repository CRUD, metadata, and lifecycle management"
    tags: ["service"]
    color: "#059669"

  workspace-service:
    defaultLabel: "Workspace Service"
    description: "Workspace operations and state persistence"
    tags: ["service"]
    color: "#10B981"

  alexandria-service:
    defaultLabel: "Alexandria Service"
    description: "Knowledge base storage and retrieval"
    tags: ["service"]
    color: "#34D399"

  agent-session-service:
    defaultLabel: "Agent Session Service"
    description: "Agent session lifecycle and coordination"
    tags: ["service"]
    color: "#F59E0B"

  agent-events-service:
    defaultLabel: "Agent Events Service"
    description: "Agent session event processing and HTTP bridge"
    tags: ["service"]
    color: "#FBBF24"

  file-system-service:
    defaultLabel: "File System Service"
    description: "File operations, watching, and shell commands"
    tags: ["service"]
    color: "#6366F1"

  terminal-service:
    defaultLabel: "Terminal Service"
    description: "PTY management and terminal session handling"
    tags: ["service"]
    color: "#818CF8"

  docker-service:
    defaultLabel: "Docker Service"
    description: "Docker container and image management"
    tags: ["service"]
    color: "#0EA5E9"

  observability-service:
    defaultLabel: "Observability Service"
    description: "Monitoring, logging, and event emission"
    tags: ["service"]
    color: "#14B8A6"

  storage-service:
    defaultLabel: "Storage Service"
    description: "Typed data persistence via Electron Store"
    tags: ["service"]
    color: "#8B5CF6"

  # ============================================
  # UI COMPONENTS
  # ============================================
  panel-system:
    defaultLabel: "Panel System"
    description: "Dynamic panel registry with 50+ panels (git, markdown, code, graphs)"
    tags: ["ui"]
    color: "#EC4899"

  titlebar:
    defaultLabel: "Titlebar"
    description: "Custom window titlebar components"
    tags: ["ui"]
    color: "#F472B6"

  modals:
    defaultLabel: "Modals"
    description: "Shared modal dialogs (add repo, secrets, settings)"
    tags: ["ui"]
    color: "#F9A8D4"

  integrated-shell:
    defaultLabel: "Integrated Shell"
    description: "Primary window navigation and view switching"
    tags: ["ui"]
    color: "#DB2777"

  # ============================================
  # PANEL CATEGORIES
  # ============================================
  git-panels:
    defaultLabel: "Git Panels"
    description: "Issues, PRs, commits, diff, history, changes panels"
    tags: ["panel"]
    color: "#F97316"

  code-panels:
    defaultLabel: "Code Panels"
    description: "Files, tools, graphs, code-city visualization"
    tags: ["panel"]
    color: "#22C55E"

  markdown-panels:
    defaultLabel: "Markdown Panels"
    description: "Editor, rendering, search, slides, books"
    tags: ["panel"]
    color: "#3B82F6"

  agent-panels:
    defaultLabel: "Agent Panels"
    description: "File activity, tool use, session overview"
    tags: ["panel"]
    color: "#EAB308"

  # ============================================
  # STATE MANAGEMENT
  # ============================================
  repository-context:
    defaultLabel: "Repository Context"
    description: "Repository state and data provider"
    tags: ["state"]
    color: "#A855F7"

  panel-context:
    defaultLabel: "Panel Context"
    description: "Panel visibility, ordering, and focus state"
    tags: ["state"]
    color: "#C084FC"

  git-changes-context:
    defaultLabel: "Git Changes Context"
    description: "Git status and file change tracking"
    tags: ["state"]
    color: "#D8B4FE"

  workspace-context:
    defaultLabel: "Workspace Context"
    description: "Workspace filter and visible projects state"
    tags: ["state"]
    color: "#E9D5FF"

  # ============================================
  # EXTERNAL INTEGRATIONS
  # ============================================
  github-adapter:
    defaultLabel: "GitHub Adapter"
    description: "GitHub API integration for remote repositories"
    tags: ["integration"]
    color: "#171515"

  mcp-bridge:
    defaultLabel: "MCP Bridge"
    description: "Model Context Protocol server integration"
    tags: ["integration"]
    color: "#06B6D4"

  event-server:
    defaultLabel: "Event Server"
    description: "HTTP server for agent session events"
    tags: ["integration"]
    color: "#0891B2"

  # ============================================
  # STORES
  # ============================================
  repository-store:
    defaultLabel: "Repository Store"
    description: "Persistent repository metadata and configuration"
    tags: ["store"]
    color: "#65A30D"

  workspace-store:
    defaultLabel: "Workspace Store"
    description: "Workspace data persistence"
    tags: ["store"]
    color: "#84CC16"

  alexandria-store:
    defaultLabel: "Alexandria Store"
    description: "Knowledge base data storage"
    tags: ["store"]
    color: "#A3E635"

  user-preferences-store:
    defaultLabel: "User Preferences"
    description: "User settings and UI state persistence"
    tags: ["store"]
    color: "#BEF264"

  # ============================================
  # REPOSITORY MONITORING
  # ============================================
  repo-monitoring-worker:
    defaultLabel: "Repository Monitoring Worker"
    description: "Node.js utility process running @principal-ai/repository-monitoring-server for file watching and cache building"
    tags: ["process"]
    color: "#0D9488"

  repo-monitoring-manager:
    defaultLabel: "Repository Monitoring Manager"
    description: "Main process manager that spawns and communicates with the monitoring worker"
    tags: ["service"]
    color: "#14B8A6"

  repo-cache-registry:
    defaultLabel: "Cache Registry"
    description: "Worker-side cache storage with version tracking, hash validation, and rebuild scheduling"
    tags: ["service"]
    color: "#2DD4BF"

  git-watcher-adapter:
    defaultLabel: "Git Watcher Adapter"
    description: "Chokidar-based file system watcher detecting changes in .git and workspace files"
    tags: ["service"]
    color: "#5EEAD4"

  file-tree-builder:
    defaultLabel: "File Tree Builder"
    description: "Async file tree construction with filtering and metadata"
    tags: ["service"]
    color: "#99F6E4"

  repository-data-cache:
    defaultLabel: "Repository Data Cache"
    description: "Renderer-side EventEmitter cache with subscription tracking, batched updates, and version validation"
    tags: ["state"]
    color: "#A855F7"

  use-repository-data:
    defaultLabel: "useRepositoryData Hook"
    description: "React hook subscribing to RepositoryDataCache for reactive UI updates"
    tags: ["state"]
    color: "#C084FC"

  repo-monitoring-service:
    defaultLabel: "Repository Monitoring Service"
    description: "Renderer-side service wrapper for IPC communication with monitoring system"
    tags: ["service"]
    color: "#7C3AED"

edgeComponents:
  # ============================================
  # COMMUNICATION TYPES
  # ============================================
  ipc:
    label: "IPC"
    description: "Electron IPC communication (invoke/send)"
    style: "solid"
    color: "#6366F1"

  ipc-event:
    label: "IPC Event"
    description: "Reactive IPC event subscription"
    style: "dashed"
    color: "#818CF8"

  context-provider:
    label: "Context"
    description: "React Context provider relationship"
    style: "solid"
    color: "#A855F7"

  websocket:
    label: "WebSocket"
    description: "WebSocket connection"
    style: "solid"
    color: "#14B8A6"

  http:
    label: "HTTP"
    description: "HTTP API communication"
    style: "solid"
    color: "#F59E0B"

  file-watch:
    label: "File Watch"
    description: "File system watch subscription"
    style: "dashed"
    color: "#22C55E"

  renders:
    label: "Renders"
    description: "Parent renders child component"
    style: "solid"
    color: "#EC4899"

  uses:
    label: "Uses"
    description: "Component uses/depends on another"
    style: "dotted"
    color: "#64748B"

  stores-in:
    label: "Stores In"
    description: "Service persists data to store"
    style: "solid"
    color: "#84CC16"

  worker-message:
    label: "Worker Message"
    description: "Node.js worker/utility process postMessage communication"
    style: "solid"
    color: "#0D9488"

  cache-sync:
    label: "Cache Sync"
    description: "RepositoryCacheSyncEvent broadcast"
