name: Build Linux App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxkbfile-dev \
            libsecret-1-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: Install Python icon dependency
        run: python -m pip install Pillow

      - name: Configure GitHub dependency access
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install project dependencies
        run: npm install --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install and rebuild packaged app dependencies
        working-directory: release/app
        run: |
          npm install --legacy-peer-deps --ignore-scripts
          npx electron-rebuild --force --types prod,dev,optional --module-dir .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build Linux AppImage
        run: npm run package:linux

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: principal-linux-appimage
          path: |
            release/build/*.AppImage
            release/build/latest-linux.yml
          if-no-files-found: error
          retention-days: 30
